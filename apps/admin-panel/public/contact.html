<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — Agnisiragu News</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #F5F1EB;
      color: #1C1917;
      display: flex;
      justify-content: center;
      padding: 48px 20px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: #FFFFFF;
      border: 1px solid #DDD8D0;
      border-radius: 16px;
      padding: 40px;
    }
    .brand {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #CC1F2D;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 26px;
      margin: 0 0 12px;
    }
    p.lead {
      color: #57534E;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .row {
      border-top: 1px solid #DDD8D0;
      padding: 18px 0;
    }
    .row:last-of-type {
      border-bottom: 1px solid #DDD8D0;
    }
    .label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #57534E;
      margin-bottom: 6px;
    }
    a.value {
      font-size: 17px;
      font-weight: 600;
      color: #CC1F2D;
      text-decoration: none;
    }
    a.value:hover { text-decoration: underline; }
    .footer {
      margin-top: 28px;
      font-size: 13px;
      color: #A8A29E;
      text-align: center;
    }
    .footer a { color: #57534E; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Agnisiragu News</div>
    <h1>Contact Us</h1>
    <p class="lead">
      Have a question, feedback, or a correction to report on one of our articles?
      Reach out to us directly — we read every message.
    </p>

    <div class="row">
      <div class="label">Email</div>
      <a class="value" href="mailto:agni360tn@gmail.com">agni360tn@gmail.com</a>
    </div>

    <div class="row">
      <div class="label">Publisher</div>
      <div>Agnisiragu News</div>
    </div>

    <div class="footer">
      <a href="/privacy.html">Privacy Policy</a>
    </div>
  </div>
</body>
</html>
