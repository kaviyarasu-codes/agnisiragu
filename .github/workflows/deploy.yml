# .github/workflows/deploy.yml
# CI/CD Pipeline — Agnisiragu News Platform
# Triggers on push to master branch

name: Build & Deploy

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [master]
    paths:
      - 'backend/**'

jobs:
  # ── 1. Test ───────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    # No job-level working-directory: this is an npm-workspaces monorepo
    # (root package.json lists "backend" as a workspace) with ONE
    # package-lock.json at the repo root — backend/ never has its own.
    # Install must run from the root; only the backend-specific steps
    # below (Prisma, tests, lint) need their own working-directory.

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agnisiragu_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run migrations (test DB)
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/agnisiragu_test

      - name: Run unit tests
        working-directory: backend
        run: npm test -- --passWithNoTests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/agnisiragu_test
          JWT_SECRET: test-secret-for-ci
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci

      - name: Run lint
        working-directory: backend
        run: npm run lint || true

  # ── 2. Deploy to production server ─────────────────────────────────────────
  # Production (Hostinger VPS, Traefik + a self-hosted Postgres container)
  # does NOT run infra/docker-compose.prod.yml or pull from GHCR — that
  # setup was written but never actually put into production. The real
  # deploy is a plain git clone at /docker/agnisiragu/repo on the server,
  # with a separate, server-local compose file at
  # /docker/agnisiragu/backend/docker-compose.yml (and its own .env,
  # outside this repo) that builds the backend image directly from that
  # clone. So "deploy" here is just: update the clone, rebuild, restart —
  # matching how this was always done by hand over SSH.
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://api.agnisiragu.com

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            cd /docker/agnisiragu/repo
            git fetch origin master
            git reset --hard origin/master

            cd /docker/agnisiragu/backend
            docker compose up -d --build backend

            echo "Waiting for the container to come up..."
            sleep 5
            docker ps --filter "name=agnisiragu-backend" --format "{{.Names}}: {{.Status}}"

            docker image prune -f

            echo "🚀 Deployment complete"

      - name: Notify on success
        if: success()
        run: echo "✅ Deployed successfully to production"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deployment failed — check GitHub Actions logs"
