# .github/workflows/deploy.yml
# CI Pipeline — Agnisiragu News Platform
# Triggers on push to master branch. Runs tests only — deploys are manual
# over SSH (see infra/scripts for the commands): cd /docker/agnisiragu/repo
# && git fetch/reset && cd ../backend && docker compose up -d --build backend.
# A "Deploy to Production" job existed here but needed SSH secrets that were
# never set up; removed rather than leave a job that always fails red.

name: Run Tests

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [master]
    paths:
      - 'backend/**'

jobs:
  # ── 1. Test ───────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    # No job-level working-directory: this is an npm-workspaces monorepo
    # (root package.json lists "backend" as a workspace) with ONE
    # package-lock.json at the repo root — backend/ never has its own.
    # Install must run from the root; only the backend-specific steps
    # below (Prisma, tests, lint) need their own working-directory.

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agnisiragu_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run migrations (test DB)
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/agnisiragu_test

      - name: Run unit tests
        working-directory: backend
        run: npm test -- --passWithNoTests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/agnisiragu_test
          JWT_SECRET: test-secret-for-ci
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci

      - name: Run lint
        working-directory: backend
        run: npm run lint || true
